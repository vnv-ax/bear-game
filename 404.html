<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мишка-грустишка — страница не найдена</title>
<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:#101418;color:#cfe3d4;
     font:16px/1.6 system-ui,-apple-system,sans-serif;text-align:center}
a{color:#8fd694;text-decoration:none;border:1px solid #2e4a38;border-radius:10px;padding:10px 18px;display:inline-block;margin-top:14px}
a:hover{background:#1a2620}
</style>
</head>
<body>
<div>
  <p style="font-size:44px;margin:0">🐻</p>
  <p>Медведь тут никого не нашёл.<br>Вернёмся в лес?</p>
  <a href="/">Вернуться в лес</a>
</div>
<script>
(function () {
  // GitHub Pages: /repo/что-угодно -> корень сайта /repo/
  var seg = location.pathname.split('/');
  var base = location.origin + seg.slice(0, 2).join('/') + '/';
  var link = document.querySelector('a');
  if (location.pathname !== seg.slice(0, 2).join('/') + '/') {
    link.href = base;
    location.replace(base);        // автопереход (защита от цикла — выше сравнение)
  } else {
    link.href = '/';               // корневой сайт вида user.github.io
  }
})();
</script>
</body>
</html>
